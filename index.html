<!DOCTYPE html>
‎<html lang="en">
‎<head>
‎<meta charset="UTF-8">
‎<meta name="viewport" content="width=device-width, initial-scale=1.0">
‎<title>JaytuneMoney Pro</title>
‎<style>
‎*{margin:0;padding:0;box-sizing:border-box}
‎body{background:#05070f;color:#fff;font-family:Arial}
‎.hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
‎.brain{font-size:90px;margin:15px}
‎.title{font-size:28px;color:#ffd700;font-weight:700}
‎.card{background:#121a30;border:1px solid #00ffcc;border-radius:18px;padding:18px;width:100%;max-width:380px;margin-top:15px}
‎input{width:100%;padding:12px;background:#0a0e1f;border:1px solid #1e2d4a;border-radius:10px;color:#fff;margin:6px 0}
‎.btn{width:100%;padding:13px;margin-top:10px;border:none;border-radius:10px;font-weight:700}
‎.btn-login{background:#00ffcc;color:#000}
‎.btn-trade{background:#ffd700;color:#000;display:none}
‎.btn-trade.enabled{display:block}
‎.status{margin-top:10px;padding:8px;background:#000;border-radius:8px;font-size:11px}
‎.log{background:#000;border-radius:8px;margin-top:10px;padding:8px;height:120px;overflow-y:auto;font-size:10px}
‎</style>
‎</head>
‎<body>
‎<div class="hero">
‎<div class="brain">🧠💰</div>
‎<div class="title">JaytuneMoney Pro</div>
‎<div class="card">
‎<input id="pat" placeholder="Paste pat_ token here">
‎<input id="appId" value="1089">
‎<button class="btn btn-login" id="connectBtn" onclick="connectPAT()">CONNECT BRAIN</button>
‎<button class="btn btn-trade" id="tradeBtn" onclick="startTrade()">START MONEY BOT</button>
‎<div class="status" id="status">Waiting...</div>
‎<div class="log" id="log"></div>
‎</div>
‎</div>
‎<script>
‎let ws=null,accountId=null;
‎function log(m){let d=document.getElementById('log');d.innerHTML+='<div>'+m+'</div>';d.scrollTop=d.scrollHeight;}
‎async function connectPAT(){
‎let pat=document.getElementById('pat').value.trim();
‎let appId=document.getElementById('appId').value.trim()||'1089';
‎if(!pat.startsWith('pat_')){alert('Need pat_ token');return;}
‎http://document.getElementById('connectBtn').innerText='Syncing...';
‎try{
‎let r=await fetch('https://api.derivws.com/trading/v1/options/accounts',{headers:{'Authorization':'Bearer '+pat,'Deriv-App-ID':appId}});
‎let j=await http://r.json();
‎if(!r.ok){log('FAIL '+JSON.stringify(j));return;}
‎accountId=j.data.id;
‎log('Account '+accountId);
‎let r2=await fetch('https://api.derivws.com/trading/v1/options/accounts/'+accountId+'/otp',{method:'POST',headers:{'Authorization':'Bearer '+pat,'Deriv-App-ID':appId}});
‎let j2=await http://r2.json();
‎let wsUrl=j2.data.url;
‎log('OTP OK');
‎ws=new WebSocket(wsUrl);
‎http://ws.onopen=()=>{log('CONNECTED LIVE');document.getElementById('status').innerText='CONNECTED LIVE';document.getElementById('tradeBtn').classList.add('enabled');};
‎http://ws.onmessage=e=>log(e.data.substr(0,150));
‎}catch(e){log(e.message);}
‎}
‎function startTrade(){
‎if(!ws){log('Not connected');return;}
‎let t={proposal:1,amount:1,basis:'stake',contract_type:'CALL',currency:'USD',duration:5,duration_unit:'t',underlying_symbol:'R_100'};
‎http://ws.send(JSON.stringify(t));
‎log('Trade sent');
‎}
‎</script>
‎</body>
‎</html>[0]
