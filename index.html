<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JaytuneMoney Pro</title><style>body{margin:0;background:#070a14;color:#fff;font-family:sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh}.c{width:92%;max-width:420px;background:linear-gradient(145deg,#111a33,#0a1020);border:1px solid #1e345f;border-radius:22px;padding:18px;box-shadow:0 0 50px rgba(0,255,204,.15)}.h{height:200px;background:radial-gradient(ellipse at 30% 20%,#1e3a8a,#0f1d4a 35%,#05070f 75%);border-radius:16px;display:flex;align-items:center;justify-content:center;position:relative;border:1px solid #00ffcc44;overflow:hidden}.h::before{content:'🧠';font-size:80px;filter:drop-shadow(0 0 20px #00ffcc);animation:f 3s infinite}.h::after{content:'💸';position:absolute;right:18%;top:20%;font-size:45px;filter:drop-shadow(0 0 15px #ffd700);animation:f2 3s infinite}@keyframes f{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}@keyframes f2{0%,100%{transform:translateY(-5px)}50%{transform:translateY(5px)}}h1{color:#ffd700;margin:10px 0 2px;font-size:24px}.s{color:#7a8aaa;font-size:9px;letter-spacing:2px;margin-bottom:10px}input{width:100%;box-sizing:border-box;padding:10px;background:#080d20;border:1px solid #22325a;border-radius:10px;color:#fff;margin:4px 0}button{width:100%;padding:11px;border:none;border-radius:10px;font-weight:800;margin-top:7px}#b1{background:linear-gradient(90deg,#00ffcc,#00aaff);color:#000}#b2{background:linear-gradient(90deg,#ffd700,#ffaa00);color:#000;display:none}#st{background:#050917;padding:8px;border-radius:8px;font-size:11px;border-left:3px solid #fa0;margin-top:8px}#lg{height:100px;overflow:auto;background:#02040a;border:1px solid #1a2544;border-radius:8px;margin-top:7px;padding:5px;font-size:10px}</style></head><body><div class="c"><div class="h"></div><h1>JaytuneMoney Pro</h1><div class="s">AI BRAIN + MONEY 3D • V3 PAT READY</div><input id="pat" placeholder="pat_ real token"><input id="appId" value="1089"><button id="b1">CONNECT BRAIN</button><button id="b2">START MONEY BOT</button><div id="st">Tap CONNECT to start...</div><div id="lg"></div></div><script>
‎let ws,accId;function L(t){let el=document.getElementById('lg');el.innerHTML+='<div>> '+t+'</div>';el.scrollTop=el.scrollHeight}
‎http://document.getElementById('b1').addEventListener('click',async()=>{
‎let pat=document.getElementById('pat').value.trim();let app=document.getElementById('appId').value.trim()||'1089';L('Button tapped!');L('Token '+pat.slice(0,8)+'... len '+pat.length);if(!pat.startsWith('pat_')){alert('Need real pat_ token from Deriv');return}document.getElementById('b1').innerText='Syncing...';document.getElementById('st').innerText='Connecting...';try{let r=await fetch('https://api.derivws.com/trading/v1/options/accounts',{headers:{'Authorization':'Bearer '+pat,'Deriv-App-ID':app}});let txt=await http://r.text();L('Step1 HTTP '+r.status);L(txt.slice(0,180));if(!r.ok){document.getElementById('b1').innerText='CONNECT BRAIN';document.getElementById('st').innerText='Auth failed - check token scopes';return}let j=JSON.parse(txt);accId=j.data.id;L('Account ID '+accId);let r2=await fetch('https://api.derivws.com/trading/v1/options/accounts/'+accId+'/otp',{method:'POST',headers:{'Authorization':'Bearer '+pat,'Deriv-App-ID':app}});let txt2=await http://r2.text();L('Step2 OTP '+r2.status);L(txt2.slice(0,180));if(!r2.ok){document.getElementById('b1').innerText='CONNECT BRAIN';return}let j2=JSON.parse(txt2);let wsUrl=j2.data.url;L('Opening WS...');ws=new WebSocket(wsUrl);ws.onopen=()=>{L('✅ LIVE CONNECTED!');document.getElementById('st').innerText='LIVE ✅';document.getElementById('b2').style.display='block';document.getElementById('b1').innerText='BRAIN CONNECTED ✅'};ws.onerror=()=>L('WS Error');ws.onmessage=e=>L(e.data.slice(0,130))}catch(e){L('Fetch Err: '+e.message);document.getElementById('b1').innerText='CONNECT BRAIN'}});
‎http://document.getElementById('b2').addEventListener('click',()=>{if(!ws)return;ws.send(JSON.stringify({proposal:1,amount:1,basis:'stake',contract_type:'CALL',currency:'USD',duration:5,duration_unit:'t',underlying_symbol:'R_100'}));L('Trade CALL sent')});
‎</script></body></html>
