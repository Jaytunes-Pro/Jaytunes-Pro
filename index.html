<!DOCTYPE html>
‎<html>
‎<head>
‎<meta charset="UTF-8">
‎<meta name="viewport" content="width=device-width, initial-scale=1.0">
‎<title>JaytuneMoney Pro</title>
‎<style>
‎body{margin:0;background:#070a14;color:#fff;font-family:Arial;display:flex;justify-content:center;align-items:center;min-height:100vh}
‎.wrap{width:100%;max-width:420px;padding:20px;text-align:center}
‎.logo{width:300px;height:300px;margin:0 auto 15px;background:radial-gradient(circle at 30% 30%, #1a2a5a, #05070f);border-radius:24px;display:flex;align-items:center;justify-content:center;font-size:90px;border:1px solid rgba(0,255,200,.3);box-shadow:0 0 50px rgba(0,255,200,.25)}
‎h1{font-size:28px;color:#ffd700;margin:10px 0 4px}
‎.sub{font-size:11px;color:#7a8aaa;letter-spacing:2px;margin-bottom:18px}
‎.card{background:#111a33;border:1px solid #1f2f55;border-radius:20px;padding:18px}
‎input{width:100%;box-sizing:border-box;padding:12px;background:#080d20;border:1px solid #22325a;border-radius:12px;color:#fff;margin:6px 0}
‎.btn{width:100%;padding:13px;border-radius:12px;border:none;font-weight:bold;margin-top:10px}
‎.btn1{background:linear-gradient(90deg,#00ffcc,#00aaff);color:#000}
‎.btn2{background:linear-gradient(90deg,#ffd700,#ffaa00);color:#000;display:none}
‎.btn2.show{display:block}
‎.stat{margin-top:12px;background:#050917;padding:10px;border-radius:10px;font-size:12px;text-align:left;border-left:3px solid #ffaa00}
‎.log{margin-top:10px;background:#02040a;border:1px solid #1a2544;border-radius:10px;height:140px;overflow-y:auto;padding:8px;font-size:11px;text-align:left}
‎</style>
‎</head>
‎<body>
‎<div class="wrap">
‎<div class="logo">🧠💸</div>
‎<h1>JaytuneMoney Pro</h1>
‎<div class="sub">AI BRAIN + MONEY 3D • V3 PAT READY</div>
‎<div class="card">
‎<input id="pat" placeholder="Paste pat_ token here">
‎<input id="appId" value="1089">
‎<button class="btn btn1" id="b1" onclick="connectPAT()">CONNECT BRAIN</button>
‎<button class="btn btn2" id="b2" onclick="startTrade()">START MONEY BOT</button>
‎<div class="stat" id="status">Waiting for pat_ token...</div>
‎<div class="log" id="log"></div>
‎</div>
‎</div>
‎<script>
‎let ws=null,accId=null;
‎function log(t){let l=document.getElementById('log');l.innerHTML+='<div>'+t+'</div>';l.scrollTop=l.scrollHeight;}
‎async function connectPAT(){
‎let pat=document.getElementById('pat').value.trim();
‎let app=document.getElementById('appId').value.trim()||'1089';
‎if(!pat.startsWith('pat_')){alert('Paste pat_ token');return;}
‎http://document.getElementById('b1').innerText='Syncing...';
‎try{
‎let r=await fetch('https://api.derivws.com/trading/v1/options/accounts',{headers:{'Authorization':'Bearer '+pat,'Deriv-App-ID':app}});
‎let j=await http://r.json();
‎if(!r.ok){log('FAIL '+JSON.stringify(j));document.getElementById('b1').innerText='CONNECT BRAIN';return;}
‎let data=j.data||[];
‎accId=j.data.id;
‎log('Account '+accId);
‎let r2=await fetch('https://api.derivws.com/trading/v1/options/accounts/'+accId+'/otp',{method:'POST',headers:{'Authorization':'Bearer '+pat,'Deriv-App-ID':app}});
‎let j2=await http://r2.json();
‎let url=j2.data.url;
‎log('OTP OK');
‎ws=new WebSocket(url);
‎http://ws.onopen=()=>{log('CONNECTED LIVE!');document.getElementById('status').innerText='CONNECTED LIVE';document.getElementById('b2').classList.add('show');document.getElementById('b1').innerText='CONNECTED';};
‎http://ws.onmessage=e=>log(e.data.substring(0,180));
‎}catch(e){log('Error '+e.message);}
‎}
‎function startTrade(){
‎let t={proposal:1,amount:1,basis:'stake',contract_type:'CALL',currency:'USD',duration:5,duration_unit:'t',underlying_symbol:'R_100'};
‎http://ws.send(JSON.stringify(t));
‎log('Trade sent');
‎}
‎</script>
‎</body>
‎</html>
