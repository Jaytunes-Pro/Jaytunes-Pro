‎<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JaytuneMoney Pro</title></head><body style="margin:0;background:#070a14;color:#fff;font-family:sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh"><div style="width:95%;max-width:400px;padding:15px;text-align:center"><div style="font-size:70px;background:#111a33;border-radius:20px;padding:20px;border:1px solid #00ffcc">🧠💸</div><h1 style="color:#ffd700">JaytuneMoney Pro</h1><div style="background:#111a33;border-radius:15px;padding:15px"><input id="pat" placeholder="pat_ token" style="width:100%;padding:10px;margin:5px 0"><input id="appId" value="1089" style="width:100%;padding:10px;margin:5px 0"><button id="b1" onclick="connectPAT()" style="width:100%;padding:12px;background:#00ffcc;font-weight:bold">CONNECT BRAIN</button><button id="b2" onclick="startTrade()" style="width:100%;padding:12px;background:#ffd700;font-weight:bold;display:none;margin-top:8px">START BOT</button><div id="status" style="margin-top:10px;font-size:12px;background:#000;padding:8px">Waiting...</div><div id="log" style="height:120px;overflow:auto;background:#02040a;margin-top:8px;font-size:11px;padding:5px;text-align:left"></div></div></div><script>
‎let ws,accId;function log(t){let l=document.getElementById('log');l.innerHTML+='<div>'+t+'</div>';l.scrollTop=l.scrollHeight}
‎async function connectPAT(){let pat=document.getElementById('pat').value.trim();let app=document.getElementById('appId').value.trim()||'1089';if(!pat.startsWith('pat_')){alert('pat_ needed');return};document.getElementById('b1').innerText='...';try{let r=await fetch('https://api.derivws.com/trading/v1/options/accounts',{headers:{'Authorization':'Bearer '+pat,'Deriv-App-ID':app}});let j=await http://r.json();if(!r.ok){log('FAIL '+JSON.stringify(j).slice(0,150));return}accId=j.data.id;log('Acc '+accId);let r2=await fetch('https://api.derivws.com/trading/v1/options/accounts/'+accId+'/otp',{method:'POST',headers:{'Authorization':'Bearer '+pat,'Deriv-App-ID':app}});let j2=await http://r2.json();let url=j2.data.url;log('OTP ok');ws=new WebSocket(url);ws.onopen=()=>{log('LIVE!');document.getElementById('status').innerText='LIVE';document.getElementById('b2').style.display='block';document.getElementById('b1').innerText='CONNECTED'};ws.onmessage=e=>log(e.data.slice(0,120))}catch(e){log('Err '+e.message)}}
‎function startTrade(){ws.send(JSON.stringify({proposal:1,amount:1,basis:'stake',contract_type:'CALL',currency:'USD',duration:5,duration_unit:'t',underlying_symbol:'R_100'}));log('Trade sent')}
‎</script></body></html>
